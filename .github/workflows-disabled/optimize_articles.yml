    if args.post_id:
        posts = [fetch_single_post(args.post_id)]
        log.info(f"    Single post: ID {args.post_id}")
        skip_days = 0  # always process if explicit post-id
    else:
        posts = fetch_all_english_posts()
        if args.limit:
            posts = posts[:args.limit]
        log.info(f"    Found {len(posts)} English posts.")

    # Apply skip filter
    if skip_days > 0:
        before = len(posts)
        posts  = [p for p in posts if not should_skip(p, skip_days)]
        log.info(f"    Skipped {before - len(posts)} posts (modified in last {skip_days} days).")
        log.info(f"    Will optimize {len(posts)} posts.")

    if not posts:
        log.info("Nothing to optimize. Lower --days or use --force.")
        return

    log.info(f"[6] Optimizing {len(posts)} articles...")
    log.info("=" * 60)

    results = {"success": [], "failed": []}
    total   = len(posts)

    for i, post in enumerate(posts, 1):
        pid      = post["id"]
        title    = post["title"]["rendered"]
        media_id = post.get("featured_media") or None
        editor   = detect_editor(post)
        modified = post.get("modified_gmt", "")[:10]

        if editor == "elementor":
            raw_el = fetch_elementor_raw(pid)
            curr   = extract_text_from_elementor(raw_el) if raw_el else ""
            if not curr:
                curr = strip_html(post.get("content", {}).get("rendered", ""))
        else:
            curr = strip_html(post.get("content", {}).get("rendered", ""))

        wc       = len(curr.split())
        is_short = wc < MIN_WORD_COUNT

        log.info(f"\n[{i}/{total}] Post {pid} [{editor.upper()}] mod:{modified}")
        log.info(f"  Title : {title[:65]}")
        log.info(f"  Words : {wc} {'— SHORT' if is_short else '— OK'}")

        try:
            rel_links = get_relevant_links(title, curr, WP_URL)
            related   = find_related(pid, title, all_refs)
            log.info(f"  Links : {len(rel_links)} affiliate | {len(related)} internal")

            log.info("  Pass 1: rewriting...")
            optimized = rewrite_pass1(title, curr, wc, is_short, related, rel_links)

            missing = verify_links(optimized["content"], rel_links)
            log.info(f"  Links : {len(rel_links)-len(missing)}/{len(rel_links)} present")
            if missing:
                optimized["content"] = inject_missing_links(
                    optimized["content"], missing)
                still = verify_links(optimized["content"], rel_links)
                log.info(f"  Links : {len(rel_links)-len(still)}/{len(rel_links)} after injection")

            log.info("  Pass 2: FAQ...")
            faq = rewrite_pass2_faq(
                optimized["title"],
                optimized["focus_keyword"],
                strip_html(optimized["content"])[:2000])
            optimized["content"] += "\n" + faq

            new_wc = word_count(optimized["content"])
            log.info(f"  KW    : {optimized['focus_keyword']}")
            log.info(f"  Words : {wc} → {new_wc}")

            final   = assemble_content(optimized, related)
            cat_ids = resolve_cats(optimized["categories"], cat_map)
            tag_ids = sync_tags(optimized["tags"])

            if editor == "elementor":
                updated = process_elementor(post, optimized, final, cat_ids, tag_ids)
            else:
                updated = update_wp_post(pid, optimized, final, cat_ids, tag_ids)

            url = updated["link"]
            log.info(f"  Saved : {url}")

            meta_title = optimized.get(
                "meta_title", f"{optimized['title']} | GermanySupport.de")
            rm_ok = set_rank_math_keyword(
                pid, optimized["focus_keyword"], meta_title,
                optimized["meta_description"])

            update_image_alt(media_id, optimized["focus_keyword"], optimized["title"])

            results["success"].append({
                "id": pid, "title": optimized["title"], "url": url,
                "old_words": wc, "new_words": new_wc,
                "keyword": optimized["focus_keyword"],
                "editor": editor, "rm_ok": rm_ok,
            })

        except Exception as e:
            log.error(f"  ERROR on post {pid}: {e}")
            results["failed"].append({"id": pid, "title": title, "error": str(e)})

        if i < total:
            time.sleep(DELAY_BETWEEN)

    # Summary
    log.info("\n" + "=" * 60)
    log.info(f"COMPLETE — {CURRENT_YEAR}")
    rm_n = len([r for r in results["success"] if r["rm_ok"]])
    log.info(f"  Success      : {len(results['success'])}/{total}")
    log.info(f"  Keyword set  : {rm_n}/{len(results['success'])}")
    log.info(f"  Failed       : {len(results['failed'])}")

    need_rm = [r for r in results["success"] if not r["rm_ok"]]
    if need_rm:
        log.warning("SET FOCUS KEYWORDS MANUALLY IN RANK MATH:")
        for r in need_rm:
            log.warning(f"  [{r['id']}] {r['keyword']} → {r['url']}")

    if results["failed"]:
        log.error("Failed posts:")
        for r in results["failed"]:
            log.error(f"  [{r['id']}] {r['title'][:55]} — {r['error'][:80]}")
        sys.exit(1)


if __name__ == "__main__":
    main()