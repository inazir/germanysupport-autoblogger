"""
    return parse_claude_json(claude_call(system, user))


def rewrite_pass2_faq(title, keyword, summary):
    system = f"""
Write FAQ for expat guides about Germany ({CURRENT_YEAR}).
Use Rank Math FAQ schema markup:
<div class="rank-math-faq-item">
  <h3 class="rank-math-question">Question?</h3>
