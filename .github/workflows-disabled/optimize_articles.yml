def detect_editor(post):
    meta = post.get("meta", {})
    if meta.get("_elementor_edit_mode") == "builder":
        return "elementor"
    data = meta.get("_elementor_data", "")
    if data and data not in ("", "[]", None):
        return "elementor"
    return "gutenberg"


