# ============================================================

def set_rank_math_keyword(post_id, keyword, meta_title, meta_description):
    # Method 1: custom Code Snippets endpoint
    try:
        r = wp_post_req(
            f"{WP_URL}/wp-json/gs/v1/set-keyword",
            json={"post_id": post_id, "keyword": keyword,
                  "title": meta_title, "description": meta_description})
        if r.ok and r.json().get("success"):
            log.info(f"  Rank Math: keyword set ✓  [{keyword}]")
            return True
    except Exception as e:
        log.warning(f"  Custom endpoint: {e}")

    # Method 2: native Rank Math API
    try:
        r2 = wp_post_req(
            f"{WP_URL}/wp-json/rankmath/v1/updateMeta",
            json={"objectID": post_id, "objectType": "post",
                  "meta": {"rank_math_focus_keyword": keyword,
                            "rank_math_title":         meta_title,
                            "rank_math_description":   meta_description}})
        if r2.ok:
            log.info(f"  Rank Math: keyword set via native API ✓")
            return True
    except Exception as e:
        log.warning(f"  Native API: {e}")

    log.warning(f"  Rank Math FAILED — set manually: '{keyword}'")
    return False


