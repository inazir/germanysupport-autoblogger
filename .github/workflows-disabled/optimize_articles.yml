# ============================================================
#  🔄  HTTP SESSION WITH RETRY
# ============================================================

def build_session():
    s = requests.Session()
    r = Retry(total=5, backoff_factor=20,
              status_forcelist=[500, 502, 503, 504],
              allowed_methods=["GET", "POST", "PUT", "DELETE"],
              raise_on_status=False)
    a = HTTPAdapter(max_retries=r)
    s.mount("https://", a)
    s.mount("http://",  a)
    return s

SESSION = build_session()


def build_headers():
    token = base64.b64encode(f"{WP_USER}:{WP_APP_PASS}".encode()).decode()
    return {"Authorization": f"Basic {token}", "Content-Type": "application/json"}

HEADERS = build_headers()


def wp_get(url, **kw):
    kw.setdefault("timeout", TIMEOUT)
    r = SESSION.get(url, headers=HEADERS, **kw)
    r.raise_for_status()
    return r


def wp_post_req(url, **kw):
    kw.setdefault("timeout", TIMEOUT)
    r = SESSION.post(url, headers=HEADERS, **kw)
    if not r.ok:
        raise Exception(f"POST {r.status_code}: {r.text[:300]}")
    return r


def wp_request(method, endpoint, **kw):
    kw.setdefault("timeout", TIMEOUT)
    url = f"{WP_URL}/wp-json/wp/v2/{endpoint}"
    r   = SESSION.request(method, url, headers=HEADERS, **kw)
    if not r.ok:
        raise Exception(f"WP {r.status_code}: {r.text[:300]}")
    return r.json()


def strip_html(html):
    return re.sub(r"<[^>]+>", " ", html or "")


def word_count(text):
    return len(strip_html(text).split())


# ============================================================
#  📅  DATE HELPERS
# ============================================================

def parse_wp_date(s):
    try:
        return datetime.strptime(s, "%Y-%m-%dT%H:%M:%S").replace(tzinfo=timezone.utc)
    except Exception:
        return None


def should_skip(post, skip_days):
    """Return True if the post was modified within the last skip_days days."""
    if skip_days <= 0:
        return False
    d = parse_wp_date(post.get("modified_gmt", "") or "")
    if not d:
        return False
    cutoff = datetime.now(timezone.utc) - timedelta(days=skip_days)
    return d > cutoff


