def claude_call(system_prompt, user_prompt, max_tokens=4096):
    client = anthropic.Anthropic(api_key=ANTHROPIC_KEY)
    r = client.messages.create(
        model="claude-sonnet-4-20250514", max_tokens=max_tokens,
        system=system_prompt,
        messages=[{"role": "user", "content": user_prompt}])
    return r.content[0].text.strip()


def rewrite_pass1(title, curr_text, wc, is_short, related, rel_links):
    links_html  = format_links_as_html(rel_links)
    cats_str    = "\n".join(f"- {c}" for c in ALLOWED_CATEGORIES)
    target      = max(MIN_WORD_COUNT, wc)
    length_note = (
        f"EXPAND to at least {MIN_WORD_COUNT} words — currently ~{wc}."
        if is_short else f"Write {target}+ words. Do NOT shorten."
    )
    related_str = ""
    if related:
        related_str = "\n\nEmbed these INTERNAL links:\n"
        related_str += "\n".join([
            f'- <a href="{p["url"]}">{p["title"]}</a>' for p in related])

    system = f"""
You are an expert SEO writer for germanysupport.de (expat guide, Germany).
Optimizing for Rank Math SEO. Year: {CURRENT_YEAR}.

RANK MATH TARGET SCORE: 80+
1. Focus keyword in VERY FIRST sentence
2. Focus keyword near start of title
3. Focus keyword in meta description (first 10 words)
4. Focus keyword in AT LEAST 2 H2 headings exactly
5. ~1% keyword density
6. Slug: focus keyword, under {MAX_SLUG_LENGTH} chars
7. Short paragraphs (2-4 sentences)
8. Include comparison table (HTML <table>) if comparing options

CONTENT:
- {length_note}
- Update ALL info to {CURRENT_YEAR}
- Strong CTAs near affiliate links
- Do NOT add FAQ (separate pass)
- No affiliate disclosure box

AFFILIATE LINKS — ALL MANDATORY:
{links_html}{related_str}

TAPTAP RULE: always mention promo code IQBAL12 + €10 bonus for €50+.

JSON RULES: escape quotes in content: \\" not "
CATEGORIES (1-2, exact): {cats_str}

Return ONLY JSON:
{{
  "title": "KW-rich Title {CURRENT_YEAR}",
  "slug": "kw-slug-max-60",
  "meta_title": "Keyword | GermanySupport.de",
  "meta_description": "Keyword first. 150-155 chars exactly.",
  "focus_keyword": "keyword phrase",
  "tags": ["t1","t2","t3","t4","t5"],
  "categories": ["Category"],
  "content": "Complete HTML — tables, CTAs, all affiliate links, NO FAQ"
}}
"""
    user = f"""
Rewrite for Rank Math 80+ score. Year: {CURRENT_YEAR}.
TITLE: {title}
WORDS: ~{wc} → target {target}+
CONTENT: {curr_text}
ALL affiliate links MANDATORY. TapTap: include IQBAL12 promo.
