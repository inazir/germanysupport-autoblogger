def verify_links(html, links):
    return [(n, u) for n, u in links.items() if u not in html]


def inject_missing_links(html, missing):
    if not missing: return html
    log.info(f"  Pass 3: injecting {len(missing)} missing links...")
    client    = anthropic.Anthropic(api_key=ANTHROPIC_KEY)
    links_str = "\n".join([
        f"- TapTap Send (promo {TAPTAP_PROMO_TEXT.split('(')[1].rstrip(')')}: {u}"
        if n == "TapTap Send" else f"- {n}: {u}"
        for n, u in missing])
    r = client.messages.create(
        model="claude-sonnet-4-20250514", max_tokens=4096,
        system="""Embed affiliate links into HTML content naturally.
Use: <a href="URL" target="_blank" rel="nofollow sponsored">CTA text</a>
For TapTap Send: mention promo code IQBAL12 and €10 bonus near the link.
Return COMPLETE HTML unchanged except for added links. No disclosure boxes.""",
        messages=[{"role": "user", "content":
            f"Add these links:\n{links_str}\n\nARTICLE:\n{html}"}])
    result = r.content[0].text.strip()
    result = re.sub(r"^```html\s*", "", result)
    result = re.sub(r"```$", "", result).strip()
    return result


