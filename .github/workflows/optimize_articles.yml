name: SEO Optimizer — Rewrite & Update Articles

on:
  schedule:
    - cron: "0 9 1 1 *"    # January 1st
    - cron: "0 9 1 7 *"    # July 1st
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of articles to optimize (leave empty for ALL)"
        required: false
        default: ""
      post_id:
        description: "Single Post ID (leave empty for all)"
        required: false
        default: ""
      force:
        description: "Force rewrite all even if recently updated? (yes/no)"
        required: false
        default: "no"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Optimize all articles
        if: ${{ github.event.inputs.limit == '' && github.event.inputs.post_id == '' && github.event.inputs.force != 'yes' }}
        run: python optimize_articles.py
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}

      - name: Optimize all articles (force)
        if: ${{ github.event.inputs.force == 'yes' && github.event.inputs.post_id == '' }}
        run: python optimize_articles.py --force
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}

      - name: Optimize limited articles
        if: ${{ github.event.inputs.limit != '' && github.event.inputs.post_id == '' }}
        run: python optimize_articles.py --limit ${{ github.event.inputs.limit }}
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}

      - name: Optimize single post
        if: ${{ github.event.inputs.post_id != '' }}
        run: python optimize_articles.py --post-id ${{ github.event.inputs.post_id }}
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}