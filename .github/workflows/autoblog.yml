name: AutoBlogger — Publish Article

on:
  schedule:
    - cron: "0 9 * * MON"   # Every Monday at 9:00 AM UTC
    - cron: "0 9 * * THU"   # Every Thursday at 9:00 AM UTC
  workflow_dispatch:          # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Publish English article
        run: python publish_article.py
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          PEXELS_KEY:    ${{ secrets.PEXELS_KEY }}

      - name: Translate new article to German
        run: python translate_articles.py --limit 3
        env:
          WP_URL:        ${{ secrets.WP_URL }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
